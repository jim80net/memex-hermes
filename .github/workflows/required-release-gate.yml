name: Required release gate

on:
  workflow_call:

jobs:
  release-surface:
    name: Audit, runtime security, and clean wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/release-gate-models
          key: memex-hermes-minilm-${{ runner.os }}-v1

      - name: Verify hostile graph and real embedding
        run: pnpm gate:runtime
        env:
          MEMEX_RELEASE_GATE_MODEL_CACHE: .cache/release-gate-models

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist-wheel

      - name: Verify wheel contents and clean install
        run: |
          set -euo pipefail
          WHEEL=$(ls dist-wheel/*.whl | head -n 1)
          unzip -Z1 "$WHEEL" | grep -Fxq "memex_hermes/install.py"
          unzip -Z1 "$WHEEL" | grep -Fxq "memex_hermes/bin/memex"
          unzip -Z1 "$WHEEL" | grep -Fxq "memex_hermes/bin/install.sh"
          unzip -Z1 "$WHEEL" | grep -Fxq "memex_hermes/plugin.yaml"
          unzip -Z1 "$WHEEL" | grep -Fxq "memex_hermes/checksums.txt"
          ACCEPT_ROOT=$(mktemp -d)
          python -m venv "$ACCEPT_ROOT/venv"
          "$ACCEPT_ROOT/venv/bin/pip" install "$WHEEL"
          "$ACCEPT_ROOT/venv/bin/memex-hermes-install" \
            --hermes-home "$ACCEPT_ROOT/hermes" \
            --dry-run

      - name: Upload accepted wheel
        uses: actions/upload-artifact@v4
        with:
          name: memex-hermes-wheel
          path: dist-wheel/*.whl
